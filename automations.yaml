- id: porch_light_sunset
  alias: Porch light on at sunset
  trigger:
    - platform: sun
      event: sunset
      offset: "-00:15:00"
  action:
    - service: light.turn_on
      target:
        entity_id: light.porch
- id: porch_light_off_late
  alias: Porch light off at 23:30
  trigger:
    - platform: time
      at: "23:30:00"
  action:
    - service: light.turn_off
      target:
        entity_id: light.porch
- id: meetup_demo
  alias: Meetup demo — toggle the porch light
  trigger:
    - platform: state
      entity_id: input_boolean.guest_mode
      to: "on"
  action:
    - service: light.toggle
      target:
        entity_id: light.porch
